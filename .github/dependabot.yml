version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouped so a routine week is one PR to review, not twenty.
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Next.js and React majors change behaviour; upgrade them deliberately,
      # following the version-matched upgrade guide.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # jsdom 30.1 stopped keeping a Blob's implementation under an own
      # Symbol(impl), and Vitest 5.0.2's jsdom environment finds it there to
      # hand URL.createObjectURL a Node Blob — so every test that previews a
      # picked file throws. Held at 30.0 (`~30.0.1` in package.json) until a
      # Vitest release reads it the new way; lift both then.
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
