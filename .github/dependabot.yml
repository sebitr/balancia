version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # pnpm refuses to install anything published less than a day ago
    # (minimumReleaseAge), and a version bump pulls in fresh transitive
    # releases too. A PR opened inside that window fails every job at install
    # and, while main's own checks were red, nobody noticed: next 16.4.5 sat
    # in #485 for a week with every job failing on
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. Two days clears the floor.
    # Version updates only; security updates are never held back.
    cooldown:
      default-days: 2
    # Grouped so a routine week is one PR to review, not twenty.
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
      # Security fixes arrived one PR per package beside the weekly group
      # (#477 nodemailer, #480 zod), each going stale once the group carried
      # the same bump. One PR for whatever is urgent at the time.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Next.js and React majors change behaviour; upgrade them deliberately,
      # following the version-matched upgrade guide.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # jsdom 30.1 stopped keeping a Blob's implementation under an own
      # Symbol(impl), and Vitest 5.0.2's jsdom environment finds it there to
      # hand URL.createObjectURL a Node Blob — so every test that previews a
      # picked file throws. Held at 30.0 (`~30.0.1` in package.json) until a
      # Vitest release reads it the new way; lift both then.
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # One PR a month for the actions, not one per action (#473–#476).
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
