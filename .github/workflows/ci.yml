name: CI

# Pull requests run this file directly, and its job names are the checks the
# ruleset on main requires — rename one and every pull request waits forever
# for a check that no longer exists.
#
# main and version tags do not run it on their own. release.yml calls this
# whole file as its first job and publishes nothing unless every job in it
# passed, on the same commit and in the same run. A push trigger here as well
# would be the same work twice, and a run the release never looked at.
#
# Every action is pinned to a full commit SHA, with the release it was cut
# from beside it. A tag is a pointer its owner can move, and these steps run
# with the repository checked out — in release.yml, with the Docker Hub token
# in reach. Dependabot's github-actions entry moves the SHA and the comment
# together, so pinned is not the same as frozen.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A new push to a pull request supersedes the run it replaces. Nothing else is
# ever cancelled: a run on main or on a tag is one release.yml is waiting on,
# and cancelling it in favour of the next merge is how commits came to be
# published with a CI run that never finished.
#
# The prefix is spelled out rather than taken from `github.workflow`, which
# names the *caller* under workflow_call. A group that came out equal to
# release.yml's own would deadlock the run against itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  static:
    name: Lint, types and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Route types must exist before tsc sees the app.
      - run: pnpm next typegen

      - run: pnpm lint
      - run: pnpm typecheck
      # The money and session modules are held to `noUncheckedIndexedAccess`
      # on top of the repository's settings. See scripts/check-strict-indexing.sh.
      - run: pnpm typecheck:indexing
      - run: pnpm format:check

  unit:
    name: Unit and property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: balancia
          POSTGRES_PASSWORD: balancia
          POSTGRES_DB: balancia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balancia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://balancia:balancia@localhost:5432/balancia
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # These run the committed migrations, so migrations are under test too.
      - run: pnpm test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # The build only needs these to satisfy the environment schema; real
      # values are supplied at runtime.
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check the service worker was produced
        run: test -f public/sw.js

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: balancia
          POSTGRES_PASSWORD: balancia
          POSTGRES_DB: balancia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balancia -d balancia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      E2E_DATABASE_URL: postgres://balancia:balancia@localhost:5432/balancia_e2e
      DATABASE_URL: postgres://balancia:balancia@localhost:5432/balancia_e2e
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:migrate
      - run: pnpm build

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    # The image is booted against this, not merely looked inside — see the
    # last two steps. No port is published: the containers join the job's
    # network and reach it as `postgres`, the way compose reaches `db`.
    #
    # The password is chosen to need percent-encoding. The entrypoint splices
    # it into DATABASE_URL, and '/', '#', '?' and '@' are exactly the
    # characters that break a URL spliced without it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: balancia
          POSTGRES_PASSWORD: "ci/p@ss#w0rd?"
          POSTGRES_DB: balancia
        options: >-
          --health-cmd "pg_isready -U balancia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_PASSWORD: "ci/p@ss#w0rd?"
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, into the runner's own Docker. Publishing is release.yml's
      # job, and release.yml runs this one before it builds anything.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: balancia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          # The migrator should run and report a missing database cleanly
          # rather than crashing on a malformed bundle.
          docker run --rm --entrypoint node balancia:ci -e "
            const fs = require('fs');
            for (const f of ['server.js', 'dist/worker.js', 'dist/migrate.js']) {
              if (!fs.existsSync(f)) { console.error('missing ' + f); process.exit(1); }
            }
            console.log('image contains web, worker and migrator entrypoints');
          "

      - name: Confirm the app runs as a non-root user
        run: |
          test "$(docker run --rm --entrypoint id balancia:ci -u)" != "0"

      # The runtime stage copies a node_modules wholesale, so the only thing
      # keeping the build toolchain out of the shipped image is which stage it
      # is copied from. That is one word in the Dockerfile, and nothing else
      # notices when it changes back: `pnpm audit --prod` reads the lockfile,
      # not the image. Name a few of the heaviest and let the image answer.
      #
      # `sharp` is deliberately not on this list. It is a devDependency here —
      # `pnpm icons` renders the PWA set with it — but it is also an *optional*
      # dependency of `next`, which is where the copy in the image comes from.
      # Asserting its absence would be asserting that Next.js shipped without
      # its image optimizer, which is not this job's business to demand.
      - name: Confirm no dev dependencies were shipped
        run: |
          for pkg in typescript esbuild vitest jsdom drizzle-kit @playwright/test \
                     prettier eslint tailwindcss tsx; do
            if docker run --rm --entrypoint test balancia:ci -d "/app/node_modules/$pkg"; then
              echo "::error::$pkg is present in the runtime image"
              exit 1
            fi
          done
          echo "runtime image carries production dependencies only"

      # Everything above looks at files. This runs the image the way compose
      # does, through its own entrypoint and with no DATABASE_URL: the
      # entrypoint has to assemble one from the POSTGRES_* parts, apply every
      # migration with the bundled migrator, and hand over to the Next.js
      # server — which then has to say it is ready. /api/health/ready answers
      # 200 only once PostgreSQL answers and the migrations table has rows, so
      # a 200 here is all three of those steps having worked.
      #
      # RUN_WORKER_IN_WEB is left at its default, so the web process also
      # starts the jobs itself, as a single-container install does.
      - name: Boot the web role against PostgreSQL
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run -d --name balancia-web --network "$NETWORK" -p 3000:3000 \
            -e APP_URL=http://localhost:3000 \
            -e AUTH_SECRET \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PASSWORD \
            balancia:ci

          # Two minutes, and it gives up at once if the container has exited:
          # a migration failure stops the entrypoint, and waiting out the rest
          # of the clock on a dead container would only delay the logs.
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' balancia-web)" != true ]; then
              echo "::error::the web container exited before it was ready"
              docker logs balancia-web
              exit 1
            fi
            if body=$(curl -fs http://127.0.0.1:3000/api/health/ready); then
              echo "ready after $attempt attempt(s): $body"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health/ready did not answer 200 within two minutes"
          docker logs balancia-web
          exit 1

      # The same image in its other role, the one compose's `worker` profile
      # starts. It has no port to ask, so it is judged on what it says and on
      # staying up: it logs this line only once pg-boss has reached the
      # database and every queue is subscribed. It migrates too, and must find
      # the schema the web container left already current.
      - name: Boot the worker role against PostgreSQL
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run -d --name balancia-worker --network "$NETWORK" \
            -e APP_URL=http://localhost:3000 \
            -e AUTH_SECRET \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PASSWORD \
            -e RUN_WORKER_IN_WEB=false \
            balancia:ci node dist/worker.js

          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' balancia-worker)" != true ]; then
              echo "::error::the worker exited before it was ready"
              docker logs balancia-worker
              exit 1
            fi
            # Matched in the shell rather than piped to `grep -q`: grep quits
            # at the first match, and under the runner's pipefail the SIGPIPE
            # that leaves `docker logs` with turns a match into a miss.
            case "$(docker logs balancia-worker 2>&1)" in
              *'Worker ready and subscribed to queues'*)
                # The line is logged once. A process that fell over straight
                # after printing it would still have printed it.
                sleep 5
                if [ "$(docker inspect -f '{{.State.Running}}' balancia-worker)" != true ]; then
                  echo "::error::the worker started, then exited"
                  docker logs balancia-worker
                  exit 1
                fi
                echo "worker subscribed after $attempt attempt(s) and is still running"
                exit 0
                ;;
            esac
            sleep 2
          done
          echo "::error::the worker did not report ready within a minute"
          docker logs balancia-worker
          exit 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails on a high or critical advisory in a production dependency.
      - run: pnpm audit --prod --audit-level high
