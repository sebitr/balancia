name: Publish image

# Builds Balancia and pushes it to Docker Hub as sebitro/balancia.
#
# Three tags, and nothing else. A version tag (v1.4.2) publishes :1.4.2 and
# moves :latest onto it. Every merge to main publishes :preview, which is what
# main is right now — never a release, never :latest. Nothing else is offered,
# so a tag on the Docker Hub page is either a version somebody cut, the newest
# of those, or main.
#
# Two repository secrets are required, and the first push fails at login
# without them:
#
#   DOCKERHUB_USERNAME  the account that owns the repository
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
#
# The two architectures are built on their own native runners rather than one
# runner emulating the other: a Next.js build under QEMU takes the better part
# of an hour and can run the runner out of memory. Each build pushes an image
# with no tag on it — a bare digest, which nobody can pull by name — and the
# last job stitches both digests into one manifest list and puts the tags on
# that. That is what makes a plain `docker pull` serve the right image.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a half-pushed release: two runs of one tag would race over the
  # same manifest. They queue instead.
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.io/sebitro/balancia

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Free on public repositories. A private one either pays for this
          # label or drops back to QEMU on ubuntu-latest, slowly.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only. Which tags exist is decided once, in the job below.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed under its digest and nothing else: a tag here would be
          # overwritten by the other architecture a minute later.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform, so the two builds do not evict each other's
          # layers and neither collides with the CI build's cache.
          cache-from: type=gha,scope=publish-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.platform }}
          # Provenance would push a second, attestation-only manifest per
          # architecture, which the digest hand-off below has no use for.
          provenance: false

      - name: Hand the digest to the manifest job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          # Named after the runner rather than the platform: two uploads cannot
          # share a name, and an artifact name cannot contain the slash in
          # "linux/arm64".
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag and push the manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      # For docs/docker-hub.md, which the last step publishes as the Docker
      # Hub page. The digests below arrive as artifacts, not from the tree.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A version tag publishes its own number; `latest=auto` then moves
      # :latest onto it, and leaves it where it was for a pre-release such as
      # v2.0.0-rc.1. Anything that is not a tag — a merge to main, a manual
      # run — is :preview. There is deliberately no floating minor series:
      # pinning here means naming a version in full.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotate the manifest list rather than the two images under it.
          # The list is what a tag points at and what a registry browser
          # reads, so a description attached only to the images is invisible
          # exactly where somebody is looking.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=preview,enable=${{ github.ref_type != 'tag' }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          # One --annotation per line of the action's output, kept in an array
          # so a description with spaces in it survives.
          annotations=()
          while IFS= read -r line; do
            [ -n "$line" ] && annotations+=(--annotation "$line")
          done <<< "$ANNOTATIONS"

          # The word splitting is the point: one -t per tag, and one
          # image@digest per architecture, named after the files the two
          # build jobs uploaded.
          # shellcheck disable=SC2046
          docker buildx imagetools create "${annotations[@]}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # The page somebody lands on from a `docker pull` line they were given.
      # Best-effort on purpose: Docker Hub wants read/write/delete scope for
      # this one call, and a token that may only push should annotate the run
      # and leave the image it just published alone.
      - name: Update the Docker Hub page
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: sebitro/balancia
          readme-filepath: ./docs/docker-hub.md
          short-description: "Self-hosted expense splitter — shared expenses, fairly balanced, on a server you control."
