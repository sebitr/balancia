name: Publish image

# Builds Balancia and pushes it to Docker Hub as sebitro/balancia.
#
# Nothing publishes from a branch: what reaches Docker Hub is a commit somebody
# tagged. Running this by hand from the Actions tab publishes the checkout as
# :edge instead, which claims no version and never moves :latest.
#
# Two repository secrets are required, and the first push fails at login
# without them:
#
#   DOCKERHUB_USERNAME  the account that owns the repository
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
#
# The two architectures are built on their own native runners rather than one
# runner emulating the other: a Next.js build under QEMU takes the better part
# of an hour and can run the runner out of memory. Each build pushes an image
# with no tag on it — a bare digest, which nobody can pull by name — and the
# last job stitches both digests into one manifest list and puts the tags on
# that. That is what makes a plain `docker pull` serve the right image.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a half-pushed release: two runs of one tag would race over the
  # same manifest. They queue instead.
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.io/sebitro/balancia

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Free on public repositories. A private one either pays for this
          # label or drops back to QEMU on ubuntu-latest, slowly.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only. Which tags exist is decided once, in the job below.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed under its digest and nothing else: a tag here would be
          # overwritten by the other architecture a minute later.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform, so the two builds do not evict each other's
          # layers and neither collides with the CI build's cache.
          cache-from: type=gha,scope=publish-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.platform }}
          # Provenance would push a second, attestation-only manifest per
          # architecture, which the digest hand-off below has no use for.
          provenance: false

      - name: Hand the digest to the manifest job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          # Named after the runner rather than the platform: two uploads cannot
          # share a name, and an artifact name cannot contain the slash in
          # "linux/arm64".
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag and push the manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.4.2 publishes 1.4.2 and 1.4, so a compose file can follow a minor
      # series without naming every patch. `latest=auto` moves :latest with
      # the newest release and leaves a pre-release (v2.0.0-rc.1) alone.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # The word splitting is the point: one -t per tag, and one
          # image@digest per architecture, named after the files the two
          # build jobs uploaded.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
