# Balancia — containerised development environment.
#
#   docker compose -f compose.dev.yaml up --build
#
# Everything a full development loop needs, with nothing installed on the host
# but Docker: PostgreSQL 18, migrations, the Next.js dev server with hot
# reload, the background worker in watch mode, and Mailpit to catch outgoing
# email so verification and recovery flows are testable offline.
#
#   App          http://localhost:3000
#   Mailpit UI   http://localhost:8025
#   PostgreSQL   postgres://balancia:balancia@127.0.0.1:55432/balancia
#
# The database port is published so host tooling — drizzle-kit, the integration
# suite, psql — works against the same instance; that connection string is
# already what .env.local uses.
#
# Seed data (optional, after the stack is up):
#   docker compose -f compose.dev.yaml run --rm seed
#
# This file is for development only. Production self-hosting is compose.yaml:
# nothing here is hardened, the secrets are fixed and public, and the source
# tree is mounted live into the containers.

name: balancia-dev

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: balancia-dev:local

x-dev-environment: &dev-environment
  NODE_ENV: development
  # DEV_APP_URL exists for the one thing localhost cannot do: Sign in with
  # Apple, which Apple will only redirect back to over public HTTPS. Point it
  # at the tunnel hostname you registered, and leave it unset otherwise.
  APP_URL: ${DEV_APP_URL:-http://localhost:${DEV_APP_PORT:-3000}}
  DATABASE_URL: postgres://balancia:balancia@db:5432/balancia
  # Dev-only, deliberately not a secret: this stack is not reachable off-host
  # and the value is committed. Compose generates a real one for production.
  AUTH_SECRET: dev-only-insecure-secret-0123456789abcdef0123456789abcdef
  STORAGE_DRIVER: local
  STORAGE_LOCAL_PATH: /data/uploads
  # Mailpit accepts anything and delivers nowhere, so no mail escapes the host.
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_SECURE: false
  SMTP_FROM: balancia@localhost
  ALLOW_REGISTRATION: true
  # Off by default, as in production: switching it on makes real requests to a
  # third party. Set DEV_EXCHANGE_RATE_PROVIDER=frankfurter to exercise rate
  # suggestions, or point DEV_EXCHANGE_RATE_API_URL at a local stub.
  EXCHANGE_RATE_PROVIDER: ${DEV_EXCHANGE_RATE_PROVIDER:-none}
  EXCHANGE_RATE_API_URL: ${DEV_EXCHANGE_RATE_API_URL:-https://api.frankfurter.dev/v2}
  # Web Push. Unset by default: push needs a key pair, and notifications work
  # inside the app without one. `pnpm push:keys` prints a pair to paste here
  # as DEV_PUSH_VAPID_*.
  PUSH_VAPID_PUBLIC_KEY: ${DEV_PUSH_VAPID_PUBLIC_KEY:-}
  PUSH_VAPID_PRIVATE_KEY: ${DEV_PUSH_VAPID_PRIVATE_KEY:-}
  PUSH_VAPID_SUBJECT: ${DEV_PUSH_VAPID_SUBJECT:-mailto:dev@localhost}
  # On-device receipt scanning. The source tree is bind-mounted here, so
  # `pnpm ocr:install` on the host is enough — unlike the production stack,
  # which needs the models mounted or baked into the image.
  RECEIPT_SCANNING: ${DEV_RECEIPT_SCANNING:-false}
  # Which reader: the browser one by default, a provider instead or as well.
  # Handy here for pointing at a vision model running on the host —
  # DEV_RECEIPT_OCR_BASE_URL=http://host.docker.internal:11434/v1
  RECEIPT_OCR_LOCAL: ${DEV_RECEIPT_OCR_LOCAL:-true}
  RECEIPT_OCR_PROVIDER: ${DEV_RECEIPT_OCR_PROVIDER:-none}
  RECEIPT_OCR_API_KEY: ${DEV_RECEIPT_OCR_API_KEY:-}
  RECEIPT_OCR_BASE_URL: ${DEV_RECEIPT_OCR_BASE_URL:-}
  RECEIPT_OCR_MODEL: ${DEV_RECEIPT_OCR_MODEL:-}
  # Sign in with Apple. Unset by default; setting these also means setting
  # DEV_APP_URL, because the schema refuses the combination of Apple sign-in
  # and a localhost APP_URL that Apple would never redirect to.
  APPLE_CLIENT_ID: ${DEV_APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${DEV_APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${DEV_APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${DEV_APPLE_PRIVATE_KEY:-}
  # Telemetry. "local" here rather than "opt-in": the endpoint is a compiled-in
  # constant pointing at the real collector, so a development stack must not be
  # in a mode that could reach it. Local mode still exercises every part of the
  # pipeline — recording, aggregating and the administration preview — up to
  # the network call. To exercise the call itself, point the constant in
  # src/lib/telemetry/endpoint.ts at your own collector; the transport takes
  # the address as an argument, so its tests need no such change.
  TELEMETRY_MODE: ${DEV_TELEMETRY_MODE:-local}
  TELEMETRY_CRASH_REPORTS: ${DEV_TELEMETRY_CRASH_REPORTS:-true}
  # Left off in development even though the mode above is `local`: a developer
  # should have to ask for counters to start being written.
  TELEMETRY_DEFAULT: ${DEV_TELEMETRY_DEFAULT:-false}
  TELEMETRY_DEPLOYMENT: development
  # Switch on to develop against the collecting side; the routes 404 while off.
  TELEMETRY_RECEIVER: ${DEV_TELEMETRY_RECEIVER:-false}
  METRICS_ENABLED: ${DEV_METRICS_ENABLED:-true}
  METRICS_TOKEN: ${DEV_METRICS_TOKEN:-}
  LOG_LEVEL: ${DEV_LOG_LEVEL:-debug}
  NEXT_TELEMETRY_DISABLED: 1

x-dev-volumes:
  &dev-volumes # The source tree, live. Edits on the host are what the container runs.
  - .:/app
  # node_modules and build output stay in volumes: the host's node_modules is
  # built for darwin, and Next's dev output does not belong on a slow bind
  # mount shared with a host-side `pnpm dev`.
  - node-modules:/app/node_modules
  - next-cache:/app/.next
  - pnpm-store:/pnpm/store
  - uploads:/data/uploads
  # Masked with an empty volume: agent worktrees live under .claude, and a
  # second copy of the source tree inside the mount is one the watchers poll
  # and the linter walks. Neither should happen.
  - /app/.claude

services:
  db:
    image: postgres:18-alpine
    container_name: balancia-dev-db
    environment:
      POSTGRES_USER: balancia
      POSTGRES_PASSWORD: balancia
      POSTGRES_DB: balancia
      # Match production's deterministic collation so ordering behaves the same.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 55432, not 5432: never fight a PostgreSQL already running on the host.
      - "127.0.0.1:${DEV_DB_PORT:-55432}:5432"
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data: the 18+ images store
      # data under a major-version directory and refuse to start if anything is
      # mounted at the old path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancia -d balancia"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: balancia-dev-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${DEV_MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${DEV_MAILPIT_SMTP_PORT:-1025}:1025"

  # Applies committed SQL migrations, then exits. App and worker wait for it.
  migrate:
    <<: *dev-image
    container_name: balancia-dev-migrate
    depends_on:
      db:
        condition: service_healthy
    environment: *dev-environment
    volumes: *dev-volumes
    command: ["pnpm", "db:migrate"]
    restart: "no"

  app:
    <<: *dev-image
    container_name: balancia-dev-app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *dev-environment
    volumes: *dev-volumes
    ports:
      - "${DEV_APP_PORT:-3000}:3000"
    # Webpack, not Turbopack — the one place this environment departs from a
    # host `pnpm dev`. Turbopack's watcher never fires on a bind-mounted tree
    # here (not even for edits made inside the container, and `watchOptions.
    # pollIntervalMs` does not rescue it), so it serves a stale compile
    # forever. Webpack's polling watcher picks an edit up in about a second.
    # Set DEV_BUNDLER_FLAG=--turbopack to try it once upstream fixes that.
    command:
      - sh
      - -c
      - exec pnpm exec next dev ${DEV_BUNDLER_FLAG:---webpack} --hostname 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      # A cold Turbopack compile of the first route can take a while.
      start_period: 120s

  worker:
    <<: *dev-image
    container_name: balancia-dev-worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *dev-environment
    volumes: *dev-volumes
    command: ["pnpm", "dev:worker"]
    stop_grace_period: 20s

  # Not started by `up`. Run on demand:
  #   docker compose -f compose.dev.yaml run --rm seed
  seed:
    <<: *dev-image
    container_name: balancia-dev-seed
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *dev-environment
    volumes: *dev-volumes
    command: ["pnpm", "db:seed"]
    restart: "no"

  # A shell in the app environment, for pnpm/drizzle-kit/vitest inside the
  # container: docker compose -f compose.dev.yaml run --rm shell
  shell:
    <<: *dev-image
    container_name: balancia-dev-shell
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *dev-environment
    volumes: *dev-volumes
    command: ["sh"]
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  db-data:
    name: balancia-dev-db-data
  node-modules:
    name: balancia-dev-node-modules
  next-cache:
    name: balancia-dev-next-cache
  pnpm-store:
    name: balancia-dev-pnpm-store
  uploads:
    name: balancia-dev-uploads
