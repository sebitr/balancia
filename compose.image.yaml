# Balancia from Docker Hub, instead of built from this checkout.
#
# Most instances never type this filename. `./scripts/bootstrap.sh` asks which
# way this host wants it and writes the answer as
# COMPOSE_FILE=compose.yaml:compose.image.yaml, which is what makes an ordinary
# command mean both files:
#
#   docker compose pull
#   docker compose up -d
#
# Naming them with -f is the same thing for one command, and needs no .env:
#
#   docker compose -f compose.yaml -f compose.image.yaml up -d
#
# Everything else is compose.yaml's and unchanged: the database, the volumes,
# the environment, the worker's command. Only where the app and the worker get
# their image from moves — a published multi-architecture image built by
# .github/workflows/release.yml, rather than a build on this host. You still
# need `.env`, so `./scripts/bootstrap.sh` runs first either way.
#
# `latest` follows the newest release. Pin it to a version once other people
# depend on this instance — `sebitro/balancia:0.1.0` — so that an upgrade is
# something you do rather than something that happens. `preview` is main,
# rebuilt on every merge, and is not for an instance anybody relies on.
#
# `!reset` needs Compose 2.24 or newer. It is what removes the build section
# inherited from compose.yaml; without it, `up --build` would quietly go back
# to building from source and the published image would never be used.

services:
  app:
    build: !reset null
    image: sebitro/balancia:latest

  worker:
    build: !reset null
    image: sebitro/balancia:latest
