# Balancia — self-hosted deployment.
#
#   ./scripts/bootstrap.sh && docker compose up -d --build
#
# The first command writes a .env with this instance's own database password
# and auth secret; it never overwrites values you have already set, so it is
# safe in front of every `up`. The second brings up PostgreSQL 18, the web app
# and the background worker — the last two from one image.
#
# Migrations are applied by the image's entrypoint before either container
# serves anything, so there is no separate migration step to order. Both doing
# it at once is fine: the runner takes a PostgreSQL advisory lock, so whichever
# starts second waits and then finds the schema already current.

name: balancia

x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  # The entrypoint assembles DATABASE_URL from this, percent-encoding it, so
  # the password may contain anything. Set DATABASE_URL in .env to override and
  # point at a database outside this project.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/bootstrap.sh first}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  AUTH_SECRET: ${AUTH_SECRET:?run ./scripts/bootstrap.sh first}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Balancia}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_PATH: /data/uploads
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:-}
  # Nothing forwards a variable this file does not name: an operator who sets
  # EXCHANGE_RATE_PROVIDER in .env gets it interpolated here or not at all.
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-none}
  EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://api.frankfurter.dev/v1}
  # Web Push. Unset by default, which leaves notifications working inside the
  # app and only turns push delivery off. Generate a pair with `pnpm push:keys`.
  PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
  PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
  PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
  # Opt-in, and needs `pnpm semantic:install` plus a relaxed CSP. Off here means
  # the deterministic rules do the categorising, which is the default anyway.
  SEMANTIC_CATEGORIZATION: ${SEMANTIC_CATEGORIZATION:-false}
  # Opt-in, and needs `pnpm ocr:install` plus the same relaxed CSP. Forwarding
  # it is not enough on its own: the models have to be inside the container
  # too. See the commented-out volume on the app service below.
  RECEIPT_SCANNING: ${RECEIPT_SCANNING:-false}
  # Sign in with Apple. Off unless all four are set. Needs a paid Apple
  # Developer account and a public HTTPS APP_URL registered with Apple; the
  # private key is the .p8 contents, with newlines written as \n.
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-0}
  # This stack runs a dedicated worker container, so the web process must not
  # also run one — two of them would generate every recurring expense twice.
  # It is forwarded rather than omitted so that `docker compose up app` alone
  # is a usable single-container install.
  RUN_WORKER_IN_WEB: ${RUN_WORKER_IN_WEB:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:18-alpine
    container_name: balancia-db
    environment:
      POSTGRES_USER: balancia
      POSTGRES_DB: balancia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/bootstrap.sh first}
      # Deterministic collation so ordering does not shift under a locale change.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # The parent directory, not .../data. From 18 on, these images keep the
      # cluster in a version-specific subdirectory (/var/lib/postgresql/18/docker)
      # so that pg_upgrade can run without crossing a mount boundary, and they
      # refuse to start at all if anything is mounted at the old .../data path.
      - db-data:/var/lib/postgresql
    # No `ports:` — PostgreSQL is reachable only on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancia -d balancia"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    volumes:
      - uploads:/data/uploads
      # On-device receipt scanning (RECEIPT_SCANNING=1). Run
      # `pnpm ocr:install --yes` on the host, then uncomment this so the ~32 MB
      # of models is mounted rather than baked into the image — otherwise they
      # are rebuilt away and have to be reinstalled before every `up --build`.
      # - ./public/models:/app/public/models:ro
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:3000/api/health/ready || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    volumes:
      - uploads:/data/uploads
    command: ["node", "dist/worker.js"]
    # The image's HEALTHCHECK curls the web server, which this container does
    # not run — inheriting it would leave the worker permanently "unhealthy"
    # however well it is working. Liveness here is simply the process running.
    healthcheck:
      disable: true
    restart: unless-stopped
    # The worker finishes in-flight jobs on SIGTERM before exiting.
    stop_grace_period: 40s

volumes:
  db-data:
    name: balancia-db-data
  uploads:
    name: balancia-uploads
