# Balancia — one-command self-hosted deployment.
#
#   docker compose up -d --build
#
# What that gives you: PostgreSQL 18, a migration step that runs to completion
# before anything else starts, the web app, and the background worker — all
# from one image.
#
# Secrets: on first run, `init-secrets` generates AUTH_SECRET and the database
# password into a named volume and reuses them on every later start. Nothing
# here ships a fixed shared secret. To pin your own values instead, copy
# .env.example to .env and set them there.

name: balancia

x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Balancia}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_PATH: /data/uploads
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:-}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # Generates and persists secrets on first run. Idempotent: if the files
  # already exist it leaves them alone, so restarts never invalidate sessions.
  init-secrets:
    image: alpine:3.21
    container_name: balancia-init-secrets
    volumes:
      - secrets:/secrets
    environment:
      AUTH_SECRET_OVERRIDE: ${AUTH_SECRET:-}
      POSTGRES_PASSWORD_OVERRIDE: ${POSTGRES_PASSWORD:-}
    command:
      - /bin/sh
      - -euc
      - |
        umask 077
        if [ -n "$${AUTH_SECRET_OVERRIDE}" ]; then
          printf '%s' "$${AUTH_SECRET_OVERRIDE}" > /secrets/auth_secret
        elif [ ! -s /secrets/auth_secret ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /secrets/auth_secret
          echo "Generated a new AUTH_SECRET."
        fi
        if [ -n "$${POSTGRES_PASSWORD_OVERRIDE}" ]; then
          printf '%s' "$${POSTGRES_PASSWORD_OVERRIDE}" > /secrets/postgres_password
        elif [ ! -s /secrets/postgres_password ]; then
          head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40 > /secrets/postgres_password
          echo "Generated a new PostgreSQL password."
        fi
        echo "Secrets ready."
    restart: "no"

  db:
    image: postgres:18-alpine
    container_name: balancia-db
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: balancia
      POSTGRES_DB: balancia
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Deterministic collation so ordering does not shift under a locale change.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    # No `ports:` — PostgreSQL is reachable only on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancia -d balancia"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  # Applies committed SQL migrations, then exits. Web and worker wait for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-migrate
    depends_on:
      db:
        condition: service_healthy
      init-secrets:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    volumes:
      - secrets:/run/secrets:ro
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export DATABASE_URL="postgres://balancia:$$(cat /run/secrets/postgres_password)@db:5432/balancia"
        export AUTH_SECRET="$$(cat /run/secrets/auth_secret)"
        exec node dist/migrate.js
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    volumes:
      - uploads:/data/uploads
      - secrets:/run/secrets:ro
    ports:
      - "${APP_PORT:-3000}:3000"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export DATABASE_URL="postgres://balancia:$$(cat /run/secrets/postgres_password)@db:5432/balancia"
        export AUTH_SECRET="$$(cat /run/secrets/auth_secret)"
        exec /sbin/tini -- node server.js
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:3000/api/health/ready || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    volumes:
      - uploads:/data/uploads
      - secrets:/run/secrets:ro
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export DATABASE_URL="postgres://balancia:$$(cat /run/secrets/postgres_password)@db:5432/balancia"
        export AUTH_SECRET="$$(cat /run/secrets/auth_secret)"
        exec /sbin/tini -- node dist/worker.js
    restart: unless-stopped
    # The worker finishes in-flight jobs on SIGTERM before exiting.
    stop_grace_period: 40s

volumes:
  db-data:
    name: balancia-db-data
  uploads:
    name: balancia-uploads
  secrets:
    name: balancia-secrets
