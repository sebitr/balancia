# Balancia — self-hosted deployment.
#
# This file is not run by hand. bootstrap.sh puts it here — beside it in a
# standalone install, above it as scripts/bootstrap.sh in a checkout — writes
# the .env holding this instance's own database password and auth secret, and
# offers to bring the stack up. It never overwrites a value already set, so it
# is safe in front of every `up`:
#
#   sh bootstrap.sh              # standalone
#   ./scripts/bootstrap.sh       # in a checkout
#
# What comes up is PostgreSQL 18 and the web app — two containers, and the app
# runs the background jobs itself.
#
# That is the default because it is the whole application in one place: nothing
# to keep in step, one log to read, one container to restart. A large instance
# that would rather keep the jobs off the web container's event loop turns the
# `worker` service on; it is a profile, and the two lines it needs are at the
# bottom of this file.
#
# Migrations are applied by the image's entrypoint before the app serves
# anything, so there is no separate migration step to order. Two containers
# doing it at once is fine as well: the runner takes a PostgreSQL advisory
# lock, so whichever starts second waits and then finds the schema current.

name: balancia

x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  # The entrypoint assembles DATABASE_URL from this, percent-encoding it, so
  # the password may contain anything. Set DATABASE_URL in .env to override and
  # point at a database outside this project.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap.sh first}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  AUTH_SECRET: ${AUTH_SECRET:?run bootstrap.sh first}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Balancia}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_PATH: /data/uploads
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:-}
  # Nothing forwards a variable this file does not name: an operator who sets
  # EXCHANGE_RATE_PROVIDER in .env gets it interpolated here or not at all.
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-none}
  EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://api.frankfurter.dev/v2}
  # Web Push. Unset by default, which leaves notifications working inside the
  # app and only turns push delivery off. Generate a pair with `pnpm push:keys`.
  PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
  PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
  PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
  # Opt-in, and needs `pnpm semantic:install` plus a relaxed CSP. Off here means
  # the deterministic rules do the categorising, which is the default anyway.
  SEMANTIC_CATEGORIZATION: ${SEMANTIC_CATEGORIZATION:-false}
  # Opt-in, and needs `pnpm ocr:install` plus the same relaxed CSP. Forwarding
  # it is not enough on its own: the models have to be inside the container
  # too. See the commented-out volume on the app service below.
  RECEIPT_SCANNING: ${RECEIPT_SCANNING:-false}
  # Which reader. The browser one is the default and needs the models above;
  # turn it off on an instance that reads only through a provider, and the
  # relaxed CSP and the mount below both stop being necessary.
  RECEIPT_OCR_LOCAL: ${RECEIPT_OCR_LOCAL:-true}
  # Optional server-side reader: anthropic, openai or gemini, or "none".
  # RECEIPT_OCR_BASE_URL points the openai driver at anything speaking the same
  # protocol — an Ollama or vLLM server on your own network needs no key.
  # This server makes the call, not the browser. See docs/receipt-scanning.md.
  RECEIPT_OCR_PROVIDER: ${RECEIPT_OCR_PROVIDER:-none}
  RECEIPT_OCR_API_KEY: ${RECEIPT_OCR_API_KEY:-}
  RECEIPT_OCR_BASE_URL: ${RECEIPT_OCR_BASE_URL:-}
  RECEIPT_OCR_MODEL: ${RECEIPT_OCR_MODEL:-}
  # Sign in with Apple. Off unless all four are set. Needs a paid Apple
  # Developer account and a public HTTPS APP_URL registered with Apple; the
  # private key is the .p8 contents, with newlines written as \n.
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-0}
  # Telemetry. Nothing is sent by default: "opt-in" means an administrator may
  # switch anonymous statistics on from Settings → Administration → Telemetry,
  # and until one does, nothing is recorded and nothing leaves the instance.
  # Set to "local" to keep counters on this server only, or "off" to disable
  # the machinery entirely and grey out the switches. See docs/telemetry.md.
  TELEMETRY_MODE: ${TELEMETRY_MODE:-opt-in}
  TELEMETRY_CRASH_REPORTS: ${TELEMETRY_CRASH_REPORTS:-true}
  TELEMETRY_DEFAULT: ${TELEMETRY_DEFAULT:-false}
  # There is no endpoint setting: where reports go is a constant in
  # src/lib/telemetry/endpoint.ts. This file decides whether anything is sent,
  # never to whom.
  # Labels reports with how this instance is deployed. It is this file.
  TELEMETRY_DEPLOYMENT: ${TELEMETRY_DEPLOYMENT:-docker-compose}
  # Run the collector — accept reports from other installations. This is what
  # telemetry.balancia.app switches on, and what a fork switches on to collect
  # its own. Off here, and the routes answer 404 while it is.
  TELEMETRY_RECEIVER: ${TELEMETRY_RECEIVER:-false}
  # Prometheus metrics at /api/metrics, for your own monitoring. Local always:
  # Balancia never transmits them. Set a token unless the published port is on
  # a private network — the app port below is reachable by whoever can reach it.
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # The web container runs the background jobs itself, which is what makes this
  # stack two containers rather than three. Set it to false in .env — together
  # with COMPOSE_PROFILES=worker, which starts the service below — to move them
  # into a process of their own. Setting one without the other is the mistake
  # this pair invites: without the profile nothing runs the jobs, and without
  # the false both processes serve the same queues.
  RUN_WORKER_IN_WEB: ${RUN_WORKER_IN_WEB:-true}
  # Puts a "Try the demo" link on the homepage, pointing wherever a demo of
  # this instance is running. Unset by default, so a self-hosted deployment
  # never sends its own users to somebody else's demo. See docs/demo.md.
  DEMO_URL: ${DEMO_URL:-}
  # Turns this container *into* that demo: no database, nothing persisted. Not
  # something to switch on here — it would replace the data this stack serves.
  # compose.demo.yaml is the stack that sets it.
  DEMO_MODE: ${DEMO_MODE:-}
  # Where signing out goes when this *is* a demo — the real site. Belongs to
  # compose.demo.yaml too; forwarded here so the two stacks read one schema.
  DEMO_EXIT_URL: ${DEMO_EXIT_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:18-alpine
    container_name: balancia-db
    environment:
      POSTGRES_USER: balancia
      POSTGRES_DB: balancia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap.sh first}
      # Deterministic collation so ordering does not shift under a locale change.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # The parent directory, not .../data. From 18 on, these images keep the
      # cluster in a version-specific subdirectory (/var/lib/postgresql/18/docker)
      # so that pg_upgrade can run without crossing a mount boundary, and they
      # refuse to start at all if anything is mounted at the old .../data path.
      - db-data:/var/lib/postgresql
    # Published, so that psql, a GUI client, drizzle-kit or a backup job can
    # reach the database from outside the stack. On every interface the host
    # has: whoever can reach this machine can open a connection, and the
    # password bootstrap generated is the only thing in front of it. An
    # operator who wants it on this host alone writes the bind address into
    # the setting — DB_PORT=127.0.0.1:5458 — and tunnels in over SSH.
    ports:
      - "${DB_PORT:-5458}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancia -d balancia"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    volumes:
      - uploads:/data/uploads
      # Payment-method logos an operator supplied. Mounted rather than baked in
      # so that dropping an SVG in is a page refresh, not a rebuild — and so
      # that artwork the repository must never carry stays on this host. The
      # directory always exists: its README is committed, everything else in it
      # is ignored.
      - ./public/payment-methods:/app/public/payment-methods:ro
      # On-device receipt scanning (RECEIPT_SCANNING=1). Run
      # `pnpm ocr:install --yes` on the host, then uncomment this so the ~32 MB
      # of models is mounted rather than baked into the image — otherwise they
      # are rebuilt away and have to be reinstalled before every `up --build`.
      # - ./public/models:/app/public/models:ro
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:3000/api/health/ready || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  # Optional. Off unless COMPOSE_PROFILES=worker is set, because the app above
  # already does this work — see RUN_WORKER_IN_WEB. Worth turning on when a job
  # is heavy enough to be felt in request latency: a large import commit, or
  # server-side receipt reading on a small machine. Both settings move together:
  #
  #   COMPOSE_PROFILES=worker
  #   RUN_WORKER_IN_WEB=false
  #
  # `./scripts/bootstrap.sh` writes the second when it finds the first.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    image: balancia:local
    container_name: balancia-worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    volumes:
      - uploads:/data/uploads
    command: ["node", "dist/worker.js"]
    # The image's HEALTHCHECK curls the web server, which this container does
    # not run — inheriting it would leave the worker permanently "unhealthy"
    # however well it is working. Liveness here is simply the process running.
    healthcheck:
      disable: true
    restart: unless-stopped
    # The worker finishes in-flight jobs on SIGTERM before exiting.
    stop_grace_period: 40s

volumes:
  db-data:
    name: balancia-db-data
  uploads:
    name: balancia-uploads
