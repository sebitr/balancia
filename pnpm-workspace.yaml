allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false
  "@tailwindcss/oxide": true
  # Both arrive via next-intl (message extraction and dev-time file watching).
  # Each ships prebuilt platform binaries, so the postinstall node-gyp fallback
  # is not needed and is declined rather than run.
  "@parcel/watcher": false
  "@swc/core": false
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1109.0"
  - "react-theme-switch-animation@1.3.0"
  # The two patched releases below are younger than the release-age floor;
  # waiting it out would keep the advisories in the audit for no gain.
  - "browserslist@4.28.7"
  - "fast-uri@3.1.6"
# Transitive dependencies with published advisories, pinned past them until
# their dependents move on their own: browserslist (GHSA-c83g-rgw3-j3cx,
# GHSA-73wf-gq98-2v4g) arrives through serwist, fast-uri (GHSA-5jgf-p345-68v8,
# GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf) through ajv under
# @hookform/resolvers. `pnpm audit --prod --audit-level high` is the check
# that says when these can go.
overrides:
  "browserslist@<=4.28.6": ^4.28.7
  "fast-uri@<3.1.6": ^3.1.6
