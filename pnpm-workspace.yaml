allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false
  "@tailwindcss/oxide": true
  # Both arrive via next-intl (message extraction and dev-time file watching).
  # Each ships prebuilt platform binaries, so the postinstall node-gyp fallback
  # is not needed and is declined rather than run.
  "@parcel/watcher": false
  "@swc/core": false
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1109.0"
  - "react-theme-switch-animation@1.3.0"
  # The patched release below is younger than the release-age floor; waiting
  # it out would keep the advisories in the audit for no gain.
  - "browserslist@4.28.7"
# Transitive dependencies with published advisories, pinned past them until
# their dependents move on their own: browserslist (GHSA-c83g-rgw3-j3cx,
# GHSA-73wf-gq98-2v4g) arrives through serwist, fast-uri (GHSA-5jgf-p345-68v8,
# GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-qw65-cvwx-89v3,
# GHSA-58mr-gqgx-xq4g) through ajv under @hookform/resolvers. The last of those
# was found in 3.1.6 itself, the release the override used to stop at.
#
# Two more only ever run on a developer's machine or in CI, and the
# production audit does not see them: brace-expansion (GHSA-q2hr-2g5m-vwhr)
# through the minimatch 3 that eslint-plugin-react and eslint-plugin-import
# still use, and esbuild (GHSA-67mh-4wv8-2f99) through the `@esbuild-kit`
# loader drizzle-kit still ships. That one is held to the drizzle-kit path:
# every other esbuild here is already past the fix. `pnpm audit --prod
# --audit-level high` is the check that says when the production ones can go;
# `pnpm audit` alone covers these.
overrides:
  "browserslist@<=4.28.6": ^4.28.7
  "fast-uri@<3.1.7": ^3.1.7
  "brace-expansion@<1.1.21": ^1.1.21
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
# The three plugins eslint-config-next brings still name ESLint 9 as their
# ceiling, and have not had a release since ESLint 10 shipped. They run on it
# with the two stopgaps in eslint.config.mjs; this says so rather than leaving
# every install to warn. Goes with those stopgaps (vercel/next.js#89764).
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-jsx-a11y>eslint": "10"
